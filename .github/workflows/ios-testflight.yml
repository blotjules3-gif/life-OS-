# Construit LifeOS et l envoie sur TestFlight, depuis un Mac de GitHub.
#
# Pourquoi ici: le Mac de Theo n a PAS Xcode, seulement les Command Line Tools.
# Il n y a ni SDK iPhone ni simulateur, donc aucune construction iOS possible
# en local. Le xcodebuild de /usr/bin est une coquille qui annonce un succes
# sans rien faire. Les runners macOS ont le vrai Xcode.
#
# Rien ne part tout seul: declenchement manuel, et upload sur false par defaut.
name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Envoyer sur TestFlight (sinon: construire seulement)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # Apple refuse tout envoi construit avec un SDK plus vieux que iOS 26.
      - name: Choisir le Xcode le plus recent
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Xcode retenu: $NEWEST"
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version
          SDK=$(xcodebuild -showsdks | grep -o 'iphoneos[0-9.]*' | sort -V | tail -1)
          echo "SDK iOS: $SDK"
          MAJOR=${SDK#iphoneos}; MAJOR=${MAJOR%%.*}
          [ "$MAJOR" -ge 26 ] || { echo "SDK trop ancien, Apple exige iOS 26 ou plus"; exit 1; }

      - name: Poser la cle App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          test -n "$ASC_KEY_P8" || { echo "secret ASC_KEY_P8 absent"; exit 1; }
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" | base64 --decode > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          head -1 ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 | grep -q "BEGIN PRIVATE KEY" \
            || { echo "la cle decodee n est pas un PEM, verifier le base64 du secret"; exit 1; }

      - name: Trousseau temporaire, certificat et profils
        env:
          CERT_P12: ${{ secrets.CERT_P12 }}
          CERT_P12_PASSWORD: ${{ secrets.CERT_P12_PASSWORD }}
          PROFILE_APP: ${{ secrets.PROFILE_APP }}
          PROFILE_WIDGETS: ${{ secrets.PROFILE_WIDGETS }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          KCPW=$(uuidgen)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')

          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Sans cette ligne, codesign ouvre une fenetre de mot de passe et le
          # job reste bloque jusqu au timeout.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
          rm -f "$RUNNER_TEMP/cert.p12"

          # LifeOS a DEUX cibles signees: l app et l extension widgets.
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          printf '%s' "$PROFILE_APP" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/lifeos-app.mobileprovision
          printf '%s' "$PROFILE_WIDGETS" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/lifeos-widgets.mobileprovision

          echo "identites disponibles:"
          security find-identity -v -p codesigning "$KC"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          # Le numero de build vient du numero de run: unique et jamais en recul.
          xcodebuild archive \
            -project LifeOS.xcodeproj \
            -scheme LifeOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/LifeOS.xcarchive" \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \


      - name: Export, et envoi si demande
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          UPLOAD: ${{ inputs.upload }}
        run: |
          DEST=export
          if [ "$UPLOAD" = "true" ]; then DEST=upload; fi
          echo "destination: $DEST"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>${DEST}</string>
            <key>uploadSymbols</key><true/>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.chifandco.lifeos</key><string>LifeOS AppStore</string>
              <key>com.chifandco.lifeos.widgetsextension</key><string>LifeOS Widgets AppStore</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/LifeOS.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Garder l ipa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LifeOS-ipa
          path: ${{ runner.temp }}/export/**
          if-no-files-found: ignore

      # La cle ne doit pas survivre au job, meme s il echoue.
      - name: Effacer la cle et le trousseau
        if: always()
        run: |
          rm -rf ~/private_keys
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/lifeos-*.mobileprovision
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
