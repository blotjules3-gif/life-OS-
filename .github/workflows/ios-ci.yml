name: iOS CI

on:
  push:
    branches: [main, jules, pote]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Show available simulators
        run: xcrun simctl list devices available | head -30

      - name: Build LifeOS
        run: |
          xcodebuild \
            -project LifeOS.xcodeproj \
            -scheme LifeOS \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            build 2>&1 | tail -80

      - name: Run tests
        run: |
          xcodebuild \
            -project LifeOS.xcodeproj \
            -scheme LifeOS \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            test 2>&1 | grep -E "Test Suite|Test Case|Executed|BUILD (SUCCEEDED|FAILED)|error:" | tail -60

  backend-test:
    name: Backend Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: false  # activer quand pytest est vert en local

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install deps
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app tests

      - name: Test (pytest)
        working-directory: backend
        run: pytest -v
